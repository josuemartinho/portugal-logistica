<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111c">
<meta name="description" content="Simulador de logística rodoviária em Portugal: frotas, armazéns, contratos e economia dinâmica.">
<title>Portugal Logística</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 9h13v11H3zM16 13h6l4 4v3h-10z"/><circle cx="9" cy="22" r="2.4"/><circle cx="22" cy="22" r="2.4"/></svg>
      </div>
      <div class="brandtxt"><span>PORTUGAL</span><strong>LOGÍSTICA</strong></div>
      <div class="company" id="coName"></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="speed" id="speed"></div>
    <button class="icon-btn" id="btnLogout" title="Terminar sessão" aria-label="Terminar sessão">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="panel map-panel">
      <div class="panel-head">
        <div class="panel-title"><i class="live-dot"></i> Rede operacional <small id="mapHint"></small></div>
        <div class="legend">
          <span><i class="lg base"></i>Base</span>
          <span><i class="lg free"></i>Contratos</span>
          <span><i class="lg moving"></i>Em rota</span>
        </div>
      </div>
      <div class="mapwrap">
        <div id="map" role="application" aria-label="Mapa real de Portugal com operações"></div>
        <div class="maptools">
          <div class="seg mini" id="mapStyles">
            <button data-style="dark" class="on">Escuro</button><button data-style="light">Claro</button><button data-style="sat">Satélite</button>
          </div>
          <div class="layer-toggles" id="layerToggles">
            <label><input type="checkbox" data-layer="offers" checked> Ofertas</label>
            <label><input type="checkbox" data-layer="trips" checked> Viagens</label>
            <label><input type="checkbox" data-layer="assets" checked> Frota/Armazéns</label>
            <label><input type="checkbox" data-layer="history" checked> Histórico</label>
            <label><input type="checkbox" data-layer="companies" checked> Empresas</label>
            <label><input type="checkbox" data-layer="reach" checked> Alcance</label>
          </div>
          <button class="btn ghost sm" onclick="fitNetwork()">Ver rede</button>
        </div>
        <div class="hud">
          <div class="hud-lbl">BASE OPERACIONAL</div>
          <div class="hud-val" id="hudBase">—</div>
          <div class="hud-sub" id="hudOps"></div>
          <div class="hud-tier" id="hudTier"></div>
        </div>
      </div>
      <div class="ops" id="strip"></div>
    </section>

    <aside class="panel side-panel">
      <nav class="tabs" id="tabs"></nav>
      <div class="tabcontent" id="tabContent"></div>
    </aside>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
